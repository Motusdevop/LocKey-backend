services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lockey
      POSTGRES_USER: lockey
      POSTGRES_PASSWORD: lockey
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      LOCKEY_DB_HOST: postgres
      LOCKEY_DB_PORT: "5432"
      LOCKEY_DB_NAME: lockey
      LOCKEY_DB_USER: lockey
      LOCKEY_DB_PASSWORD: lockey
      LOCKEY_LOG_LEVEL: INFO
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
